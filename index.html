<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SpendWise — Smart Expense Tracker</title>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>

<body>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="logo">Spend<span>Wise</span></div>
    <div class="logo-sub">Expense Tracker</div>

    <div class="nav-label">Menu</div>

    <button class="nav-item active" onclick="showPage('dashboard')">
      Dashboard
    </button>

    <button class="nav-item" onclick="showPage('expenses')">
      Expenses
    </button>

    <button class="nav-item" onclick="showPage('analytics')">
      Analytics
    </button>

    <div class="nav-label">Settings</div>

    <button class="nav-item">
      Budget Goals
    </button>

    <div class="sidebar-footer">
      <div class="user-name">College Student</div>
      <div class="user-role">Personal Account</div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent">
  </main>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">

    <div class="modal-title">Add New Expense</div>

    <div class="form-group">
      <label class="form-label">Description</label>
      <input class="form-input" id="expName" type="text" placeholder="Expense name">
    </div>

    <div class="form-row">

      <div class="form-group">
        <label class="form-label">Amount</label>
        <input class="form-input" id="expAmount" type="number">
      </div>

      <div class="form-group">
        <label class="form-label">Category</label>

        <select class="form-select" id="expCat">
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Education">Education</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Health">Health</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
      </div>

    </div>

    <div class="form-group">
      <label class="form-label">Date</label>
      <input class="form-input" id="expDate" type="date">
    </div>

    <div class="form-group">
      <label class="form-label">Type</label>

      <select class="form-select" id="expType">
        <option value="expense">Expense</option>
        <option value="income">Income</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="addExpense()">Add Entry</button>
    </div>

  </div>
</div>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
